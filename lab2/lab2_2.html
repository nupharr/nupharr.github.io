<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Таблицы</title>
	<style>
		table {
			width: 200px;
			border: 1px solid rgb(185, 170, 170);
			margin: 20px;
			float: left;
		}

		td,
		th {
			border: 1px solid rgb(172, 156, 156);
			padding: 30px;
		}
	</style>
</head>

<body>
	<table>
		<caption>1-я таблицы</caption>
		<tr>
			<th rowspan="2">1</th>
			<td colspan="2">2</td>
		</tr>
		<tr>
			<td>5</td>
			<td>6</td>
		</tr>
	</table>

	<table>
		<caption>2-я таблица</caption>
		<tr>
			<th colspan="2">1</th>
		</tr>
		<tr>
			<td rowspan="2">3</td>
			<td>4</td>
		</tr>
		<tr>
			<td>6</td>
		</tr>
	</table>

	<table>
		<caption>3-я таблица</caption>
		<tr>
			<td>1</td>
			<td rowspan="2">2</td>
		</tr>
		<tr>
			<td>3</td>
		</tr>
		<tr>
			<td colspan="2">5</td>
		</tr>
	</table>

	<table>
		<caption>4-я таблица</caption>
		<tr>
			<th colspan="2">1</th>
		</tr>
		<tr>
			<td>3</td>
			<td>4</td>
		</tr>
		<tr>
			<td colspan="2">5</td>
		</tr>
	</table>
	<p><a href="../index.html">Вернуться на главную</a></p>
</body>

</html>
