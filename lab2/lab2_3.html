<!DOCTYPE html>

<head>

    <style>

        .tag {

        figure {
            margin: 1rem 0;
            text-align: center;
        }

        iframe, object, video, audio {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .fallback-link {
            display: inline-block;

            text-decoration: none;
            border: 1px solid #f5c6cb;

        .fallback-link:hover {

</head>
